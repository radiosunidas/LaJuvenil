<link rel="manifest" href="manifest.json">
  <style>
    /* Ventana de instalación */
    .install-prompt-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .install-prompt-hidden { display: none !important; }
    .install-prompt-content {
      background: #fff; color: #333; padding: 2rem; border-radius: 16px;
      max-width: 420px; width: 90%; text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .install-prompt-content h2 { color: #53012e; margin-bottom: 0.8rem; }
    .install-buttons { display: flex; gap: 0.8rem; justify-content: center; flex-wrap: wrap; margin-top: 1rem; }
    .install-btn { padding: 0.75rem 1.5rem; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; }
    .install-btn.install { background: #53012e; color: #fff; }
    .install-btn.close { background: #f0f0f0; color: #444; }
    
    /* Audio oculto */
    #nativeAudio { display: none; }
    
    /* Estado visual del botón Play */
    .player-button-play.playing-state {
      box-shadow: 0 0 0 4px rgba(255, 193, 7, 0.4), 0 0 25px rgba(255, 193, 7, 0.6) !important;
    }
    .player-button-play.playing-state::after {
      content: ''; position: absolute; inset: -4px; border-radius: 50%;
      border: 2px solid transparent; border-top-color: #ffc107; border-right-color: #ffc107;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    
    /* Estado del stream */
    .stream-status { font-size: 0.85rem; opacity: 0.7; margin-top: 0.3rem; min-height: 1.2rem; }
    .stream-status.live { color: #4ade80; opacity: 1; }
    .stream-status.connecting { color: #fbbf24; opacity: 1; }
    .stream-status.error { color: #f87171; opacity: 1; }
  </style>
  <script>
    let audioElement = null;
    let isPlaying = false;
    let deferredPrompt;
    
    document.addEventListener('DOMContentLoaded', () => {
      initAudio();
      initInstallPrompt();
      
      // Reemplaza el enlace del stream en tu objeto existente
      if (window.streams && window.streams.stations) {
        window.streams.stations[0].stream_url = "https://stream.zeno.fm/hdueixh3dwquv.mp3";
      }
    });
    
    function initAudio() {
      audioElement = document.createElement('audio');
      audioElement.id = 'nativeAudio';
      audioElement.preload = 'auto';
      document.body.appendChild(audioElement);
      
      audioElement.addEventListener('playing', () => {
        isPlaying = true;
        updatePlayButtonVisual(true);
        updateStatus('live', '🔴 EN VIVO — Reproduciendo');
      });
      
      audioElement.addEventListener('pause', () => {
        isPlaying = false;
        updatePlayButtonVisual(false);
        updateStatus('idle', 'Haz clic para reproducir');
      });
      
      audioElement.addEventListener('error', () => {
        isPlaying = false;
        updatePlayButtonVisual(false);
        updateStatus('error', '❌ Error — Intenta de nuevo');
      });
      
      // Interceptar el clic del botón Play que ya existe en tu página
      const playCheck = setInterval(() => {
        const btn = document.querySelector('.player-button-play, .play-button');
        if (btn) {
          clearInterval(playCheck);
          btn.addEventListener('click', interceptPlay);
        }
      }, 300);
    }
    
    function interceptPlay() {
      if (!audioElement) return;
      
      if (!audioElement.src) {
        // Tomar la URL del primer stream
        if (window.streams && window.streams.stations[0]) {
          audioElement.src = window.streams.stations[0].stream_url;
        }
      }
      
      if (isPlaying) {
        audioElement.pause();
      } else {
        audioElement.play().catch(err => {
          console.log('Necesario clic primero:', err);
          updateStatus('connecting', 'Haz clic otra vez para iniciar');
        });
      }
    }
    
    function updatePlayButtonVisual(playing) {
      const btn = document.querySelector('.player-button-play, .play-button');
      if (!btn) return;
      
      if (playing) {
        btn.classList.add('playing-state');
      } else {
        btn.classList.remove('playing-state');
      }
    }
    
    function updateStatus(type, message) {
      let statusEl = document.querySelector('.stream-status');
      if (!statusEl) {
        const target = document.querySelector('.station-description, .player-info');
        if (target) {
          statusEl = document.createElement('div');
          statusEl.className = 'stream-status';
          target.appendChild(statusEl);
        }
      }
      if (statusEl) {
        statusEl.className = 'stream-status ' + type;
        statusEl.textContent = message;
      }
    }
    
    function initInstallPrompt() {
      const modal = document.createElement('div');
      modal.id = 'installPromptModal';
      modal.className = 'install-prompt-modal';
      modal.innerHTML = `
        <div class="install-prompt-content">
          <h2>📻 Bienvenido a La JuVeNiL</h2>
          <p>¿Quieres instalar nuestra radio en tu dispositivo?</p>
          <div class="install-buttons">
            <button class="install-btn install" id="installBtn">📥 Instalar ahora</button>
            <button class="install-btn close" id="closeInstallBtn">✕ Más tarde</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
      
      if (localStorage.getItem('pwaInstalled') === 'true') {
        modal.classList.add('install-prompt-hidden');
      }
      
      window.addEventListener('beforeinstallprompt', e => {
        e.preventDefault();
        deferredPrompt = e;
      });
      
      document.addEventListener('click', e => {
        if (e.target.id === 'installBtn' && deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(choice => {
            if (choice.outcome === 'accepted') {
              localStorage.setItem('pwaInstalled', 'true');
              modal.classList.add('install-prompt-hidden');
            }
            deferredPrompt = null;
          });
        }
        if (e.target.id === 'closeInstallBtn') {
          modal.classList.add('install-prompt-hidden');
        }
      });
      
      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        modal.classList.add('install-prompt-hidden');
      });
    }
  </script>
