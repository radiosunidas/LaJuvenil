  <style>
    /* ✅ VENTANA DE INSTALACIÓN */
    .install-prompt-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .install-prompt-hidden {
      display: none !important;
    }
    .install-prompt-content {
      background: #fff;
      color: #333;
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .install-prompt-content h2 {
      color: #1E90FF;
      margin-bottom: 0.8rem;
      font-size: 1.3rem;
    }
    .install-prompt-content p {
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .install-buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .install-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.25s ease;
    }
    .install-btn.install {
      background: #1E90FF;
      color: #fff;
    }
    .install-btn.install:hover {
      background: #187bcd;
    }
    .install-btn.close {
      background: #f0f0f0;
      color: #444;
    }
    .install-btn.close:hover {
      background: #e0e0e0;
    }

    /* ✅ BOTÓN PLAY — INDICA SI ESTÁ REPRODUCIENDO */
    .player-button-play {
      width: 72px !important;
      height: 72px !important;
      border-radius: 50% !important;
      background: #fff !important;
      color: #1E90FF !important;
      box-shadow: 0 0 15px rgba(30,144,255,0.4) !important;
      transition: all 0.2s ease !important;
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border: none;
      cursor: pointer;
    }
    .player-button-play svg {
      width: 32px !important;
      height: 32px !important;
      transform: none !important;
      animation: none !important;
      position: relative !important;
      z-index: 2 !important;
    }
    .player-button-play.reproduciendo::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #1E90FF;
      border-right-color: #1E90FF;
      animation: bordeGirando 1s linear infinite;
    }
    @keyframes bordeGirando {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    /* ✅ AUDIO OCULTO */
    #nativeAudio { display: none; }

    /* ✅ ECUALIZADOR */
    .visualizer {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      height: 80px;
      gap: 2px;
      padding: 10px 0;
    }
    .visualizer-bar {
      min-height: 4px;
      width: 3px;
      border-radius: 2px 2px 0 0;
      background: linear-gradient(to top, #1E90FF, #00BFFF, #fff);
      transition: height 0.12s ease-out;
    }
  </style>

  <script>
    // ✅ ENLACES CORREGIDOS
    window.streams = {
      timeRefresh: 5000,
      stations: [
        {
          name: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          hash: "La JuVeNiL",
          description: "En vivo",
          logo: "assets/marca_model.png",
          album: "assets/logo_model.jpg",
          cover: "assets/logo_model.jpg",
          api: "https://stream2.eistreaming.com/cp/get_info.php?p=8004",
          stream_url: "https://stream.zeno.fm/hdueixh3dwquv.mp3",
          server: "icecast",
          program: {
            time: "",
            name: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
            description: "Esperando señal...",
          },
          social: {
            facebook: "https://www.facebook.com/",
            youtube: "https://www.youtube.com/",
            instagram: "https://www.instagram.com/",
            tiktok: "https://www.tiktok.com/",
          }
        },
        {
          name: "RADIOS UNIDAS",
          hash: "radiosunidas",
          description: "La señal que une a todos",
          logo: "assets/marca.png",
          album: "assets/radiosunidas.jpg",
          cover: "assets/radiosunidas.jpg",
          api: "",
          stream_url: "", // ✅ PON AQUÍ TU ENLACE DE STREAM SI LO TIENES
          server: "",
          program: {
            time: "",
            name: "RADIOS UNIDAS",
            description: "Próximamente disponible",
          },
          social: {
            facebook: "https://www.facebook.com/RadiosUnidas",
            youtube: "https://www.youtube.com/@RadiosUnidas",
            instagram: "https://www.instagram.com/radiosunidas",
            tiktok: "https://www.tiktok.com/@radiosunidas",
          }
        }
      ]
    };

    let audioElement = null;
    let isPlaying = false;
    let deferredPrompt;
    let audioContext = null;
    let analyser = null;
    let animationFrameId = null;

    document.addEventListener('DOMContentLoaded', () => {
      initAudio();
      initInstallPrompt();
      initPlayButton();
      initVisualizer();
    });

    // ✅ SISTEMA DE AUDIO
    function initAudio() {
      audioElement = document.createElement('audio');
      audioElement.id = 'nativeAudio';
      audioElement.preload = 'auto';
      document.body.appendChild(audioElement);

      const audio = audioElement;
      const station = window.streams.stations[0];

      if (station.stream_url) {
        audio.src = station.stream_url;
        audio.load();
      }

      audio.addEventListener('playing', () => {
        isPlaying = true;
        updatePlayButtonUI(true);
        updateStationDesc("🔴 EN VIVO — Reproduciendo");
      });

      audio.addEventListener('pause', () => {
        isPlaying = false;
        updatePlayButtonUI(false);
        updateStationDesc("Haz clic para reproducir");
        detenerVisualizacion();
      });

      audio.addEventListener('error', () => {
        isPlaying = false;
        updatePlayButtonUI(false);
        updateStationDesc("❌ Error — Intenta de nuevo");
        detenerVisualizacion();
      });

      audio.addEventListener('canplay', () => {
        updateStationDesc("✅ Listo — Haz clic en Play");
      });
    }

    function initPlayButton() {
      const btn = document.querySelector('.player-button-play');
      if (btn) {
        btn.addEventListener('click', () => {
          if (isPlaying) {
            audioElement.pause();
          } else {
            audioElement.play().catch(err => {
              console.log('Clic necesario:', err);
              updateStationDesc("⚠️ Haz clic otra vez para iniciar");
            });
          }
        });
      }
    }

    function updatePlayButtonUI(playing) {
      const btn = document.querySelector('.player-button-play');
      if (!btn) return;

      if (playing) {
        btn.classList.add('reproduciendo');
        btn.innerHTML = `<svg fill="currentColor" viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>`;
      } else {
        btn.classList.remove('reproduciendo');
        btn.innerHTML = `<svg class="i i-play" viewBox="0 0 24 24"><path d="m7 3 14 9-14 9z"></path></svg>`;
      }
    }

    function updateStationDesc(text) {
      const desc = document.querySelector('.station-description');
      if (desc) desc.textContent = text;
    }

    // ✅ ECUALIZADOR — SOLO SE MUEVE CUANDO SUENA
    function initVisualizer() {
      const visualizer = document.querySelector('.visualizer');
      if (!visualizer) return;

      let bars = visualizer.querySelectorAll('.visualizer-bar');
      if (bars.length === 0) {
        const barCount = parseInt(visualizer.getAttribute('data-bars') || '32');
        for (let i = 0; i < barCount; i++) {
          const bar = document.createElement('div');
          bar.className = 'visualizer-bar';
          visualizer.appendChild(bar);
        }
        bars = visualizer.querySelectorAll('.visualizer-bar');
      }

      // Iniciar todas bajas
      bars.forEach(bar => bar.style.height = '4px');

      const audio = document.getElementById('nativeAudio');
      if (audio) {
        audio.addEventListener('playing', iniciarVisualizacion);
        audio.addEventListener('pause', detenerVisualizacion);
        audio.addEventListener('ended', detenerVisualizacion);
        audio.addEventListener('error', detenerVisualizacion);
      }
    }

    function detenerVisualizacion() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      const bars = document.querySelectorAll('.visualizer-bar');
      bars.forEach(bar => bar.style.height = '4px');
    }

    function iniciarVisualizacion() {
      const audio = document.getElementById('nativeAudio');
      const visualizer = document.querySelector('.visualizer');
      if (!audio || !visualizer) return;

      const bars = visualizer.querySelectorAll('.visualizer-bar');

      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;
        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);
        
        if (audioContext.state === 'suspended') audioContext.resume();
        
        const source = audioContext.createMediaElementSource(audio);
        source.connect(analyser);
        analyser.connect(audioContext.destination);
        
        function animate() {
          animationFrameId = requestAnimationFrame(animate);
          analyser.getByteFrequencyData(dataArray);
          bars.forEach((bar, i) => {
            const valor = dataArray[i] || 0;
            const altura = Math.max(4, valor / 2.5);
            bar.style.height = altura + 'px';
          });
        }
        animate();
      }
    }

    // ✅ VENTANA DE INSTALACIÓN
    function initInstallPrompt() {
      const modal = document.getElementById('installPromptModal');
      const installBtn = document.getElementById('installBtn');
      const closeBtn = document.getElementById('closeInstallBtn');

      if (localStorage.getItem('pwaInstalled') === 'true') {
        modal.classList.add('install-prompt-hidden');
        return;
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('pwaInstalled', 'true');
            modal.classList.add('install-prompt-hidden');
          }
          deferredPrompt = null;
        }
      });

      closeBtn.addEventListener('click', () => {
        modal.classList.add('install-prompt-hidden');
      });

      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        modal.classList.add('install-prompt-hidden');
        deferredPrompt = null;
      });
    }
  </script>
