          }
        }

      ]
    };

    // ✅ VENTANA DE INSTALACIÓN DEL MANIFEST
    let deferredPrompt;

    document.addEventListener('DOMContentLoaded', () => {
      const modal = document.getElementById('installPromptModal');
      const installBtn = document.getElementById('installBtn');
      const closeBtn = document.getElementById('closeInstallBtn');

      // Si ya fue instalada, no mostrar la ventana
      if (localStorage.getItem('pwaInstalled') === 'true') {
        modal.classList.add('install-prompt-hidden');
        return;
      }

      // Capturar evento de instalación
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });

      // Botón Instalar
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('pwaInstalled', 'true');
            modal.classList.add('install-prompt-hidden');
          }
          deferredPrompt = null;
        }
      });

      // Botón Cancelar
      closeBtn.addEventListener('click', () => {
        modal.classList.add('install-prompt-hidden');
      });

      // Cuando se instala desde el navegador
      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        modal.classList.add('install-prompt-hidden');
        deferredPrompt = null;
      });
    });
  </script>
