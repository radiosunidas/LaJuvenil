<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>La JuVeNiL — Te Enciende Bien</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet">
  
  <meta name="theme-color" content="#53012e">
  <link rel="manifest" href="manifest.json">
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
    body { background: linear-gradient(135deg, #53012e 0%, #2c0019 100%); min-height: 100vh; color: white; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 2rem; text-align: center; }
    .logo { width: 200px; height: 200px; margin: 0 auto 2rem; border-radius: 12px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .logo img { width: 100%; height: 100%; object-fit: cover; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #ffd700; }
    .subtitle { font-size: 1rem; opacity: 0.8; margin-bottom: 2rem; }
    
    .play-btn { width: 100px; height: 100px; border-radius: 50%; background: #ffd700; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; margin: 0 auto 2rem; transition: all 0.3s ease; }
    .play-btn:hover { transform: scale(1.05); box-shadow: 0 0 30px rgba(255, 215, 0, 0.5); }
    .play-btn.playing { background: #fff; }
    .play-btn svg { width: 40px; height: 40px; fill: #53012e; margin-left: 5px; }
    .play-btn.pause-btn svg { margin-left: 0; }
    
    .stations-list { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 1rem; margin-top: 2rem; }
    .stations-list h3 { margin-bottom: 1rem; color: #ffd700; }
    .station-item { padding: 0.8rem; border-bottom: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: background 0.2s; }
    .station-item:last-child { border-bottom: none; }
    .station-item:hover { background: rgba(255,255,255,0.1); border-radius: 6px; }
    .station-item.active { background: rgba(255, 215, 0, 0.2); border-radius: 6px; }
    
    .install-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .install-modal.hidden { display: none; }
    .install-content { background: white; color: #333; padding: 2rem; border-radius: 12px; max-width: 350px; width: 90%; text-align: center; }
    .install-content h2 { color: #53012e; margin-bottom: 1rem; font-size: 1.2rem; }
    .install-buttons { display: flex; gap: 0.8rem; justify-content: center; margin-top: 1.5rem; }
    .btn { padding: 0.6rem 1.2rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    .btn-primary { background: #53012e; color: white; }
    .btn-secondary { background: #eee; color: #333; }
    
    .status-text { margin-top: 1rem; font-size: 0.9rem; opacity: 0.7; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- 📦 Ventana de Instalación -->
  <div id="installModal" class="install-modal">
    <div class="install-content">
      <h2>📻 Bienvenido a La JuVeNiL</h2>
      <p>¿Quieres instalar nuestra radio en tu dispositivo? ¡Escúchanos con un solo clic!</p>
      <div class="install-buttons">
        <button class="btn btn-primary" id="installBtn">📥 Instalar</button>
        <button class="btn btn-secondary" id="closeInstall">✕ Más tarde</button>
      </div>
    </div>
  </div>

  <!-- 🎵 Reproductor -->
  <div class="container">
    <div class="logo">
      <img src="assets/logo_model.jpg" alt="La JuVeNiL" onerror="this.src='https://via.placeholder.com/200/53012e/ffffff?text=La+JuVeNiL'">
    </div>
    
    <h1 id="stationName">La JuVeNiL</h1>
    <p class="subtitle" id="stationDesc">Te Enciende Bien...!</p>
    
    <button class="play-btn" id="playBtn">
      <svg id="playIcon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    </button>
    <p class="status-text" id="statusText">Haz clic para reproducir ▶️</p>
    
    <div class="stations-list">
      <h3>📻 Elige tu Radio</h3>
      <div id="stationsContainer"></div>
    </div>
  </div>

  <!-- 🔊 Audio Oculto -->
  <audio id="audioPlayer" preload="auto">
    <source src="https://stream.zeno.fm/hdueixh3dwquv.mp3" type="audio/mpeg">
  

  <script>
    // 📋 Lista de Radios
    const stations = [
      {
        name: "La JuVeNiL",
        description: "Te Enciende Bien...!",
        stream: "https://stream.zeno.fm/hdueixh3dwquv.mp3",
        logo: "assets/logo_model.jpg"
      },
      {
        name: "RADIOS UNIDAS",
        description: "La señal que une a todos",
        stream: "",
        logo: "assets/radiosunidas.jpg"
      }
    ];

    let currentStation = 0;
    let isPlaying = false;
    let deferredPrompt;

    // 🚀 Iniciar todo
    document.addEventListener('DOMContentLoaded', () => {
      initStations();
      initPlayButton();
      initInstallPrompt();
    });

    // 📻 Cargar lista de radios
    function initStations() {
      const container = document.getElementById('stationsContainer');
      container.innerHTML = '';
      
      stations.forEach((station, index) => {
        const item = document.createElement('div');
        item.className = `station-item ${index === currentStation ? 'active' : ''}`;
        item.innerHTML = `<strong>${station.name}</strong><br><small>${station.description}</small>`;
        item.addEventListener('click', () => switchStation(index));
        container.appendChild(item);
      });
    }

    // 🔄 Cambiar de radio
    function switchStation(index) {
      currentStation = index;
      const station = stations[index];
      
      document.getElementById('stationName').textContent = station.name;
      document.getElementById('stationDesc').textContent = station.description;
      
      // Actualizar clase activa
      document.querySelectorAll('.station-item').forEach((el, i) => {
        el.classList.toggle('active', i === index);
      });
      
      // Detener si está reproduciendo
      if (isPlaying) {
        document.getElementById('audioPlayer').pause();
        isPlaying = false;
        updatePlayButton();
      }
      
      // Actualizar fuente de audio
      const audio = document.getElementById('audioPlayer');
      audio.src = station.stream;
      audio.load();
      
      document.getElementById('statusText').textContent = station.stream ? 'Haz clic para reproducir ▶️' : 'Próximamente disponible';
    }

    // ▶️ Botón Play/Pause
    function initPlayButton() {
      const btn = document.getElementById('playBtn');
      const audio = document.getElementById('audioPlayer');
      const statusText = document.getElementById('statusText');
      
      btn.addEventListener('click', () => {
        if (!stations[currentStation].stream) {
          statusText.textContent = '⚠️ No hay stream disponible';
          return;
        }
        
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          statusText.textContent = 'Reproducción pausada';
        } else {
          audio.play()
            .then(() => {
              isPlaying = true;
              statusText.textContent = '🎵 En vivo — Reproduciendo...';
            })
            .catch(err => {
              console.error('Error:', err);
              statusText.textContent = '❌ Error al conectar. Intenta de nuevo.';
            });
        }
        updatePlayButton();
      });
      
      // Detectar errores de audio
      audio.addEventListener('error', () => {
        statusText.textContent = '❌ No se pudo conectar al stream';
        isPlaying = false;
        updatePlayButton();
      });
    }

    function updatePlayButton() {
      const icon = document.getElementById('playIcon');
      const btn = document.getElementById('playBtn');
      
      if (isPlaying) {
        icon.innerHTML = '<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
        btn.classList.add('playing', 'pause-btn');
      } else {
        icon.innerHTML = '<path d="M8 5v14l11-7z"/>';
        btn.classList.remove('playing', 'pause-btn');
      }
    }

    // 📦 Ventana de Instalación
    function initInstallPrompt() {
      const modal = document.getElementById('installModal');
      const installBtn = document.getElementById('installBtn');
      const closeBtn = document.getElementById('closeInstall');
      
      // No mostrar si ya está instalada
      if (localStorage.getItem('pwaInstalled') === 'true') {
        modal.classList.add('hidden');
      }
      
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
      });
      
      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('pwaInstalled', 'true');
            modal.classList.add('hidden');
          }
          deferredPrompt = null;
        }
      });
      
      closeBtn.addEventListener('click', () => {
        modal.classList.add('hidden');
      });
      
      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        modal.classList.add('hidden');
      });
    }
  </script>
</body>
</html>
