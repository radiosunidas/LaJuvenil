<!-- Elemento de audio -->
  <audio id="miAudio" src="sel/jovenil.live" preload="auto">
    Tu navegador no soporta audio.
  

  <button id="btnActivar">✅ Activar Repetición</button>
  <button id="btnDesactivar">⏹️ Detener</button>
  <p id="mensaje">Listo — presiona Activar para empezar</p>

  <script>
    const audio = document.getElementById('miAudio');
    const btnActivar = document.getElementById('btnActivar');
    const btnDesactivar = document.getElementById('btnDesactivar');
    const mensaje = document.getElementById('mensaje');
    
    let temporizador = null;
    const INTERVALO = 5 * 60 * 1000; // ⏱️ 5 minutos = 300,000 ms

    // Reproduce el audio desde el principio
    function reproducir() {
      audio.currentTime = 0; // Vuelve al inicio
      audio.play()
        .then(() => {
          mensaje.textContent = '🔊 Reproduciendo — se repetirá cada 5 minutos';
        })
        .catch(err => {
          mensaje.textContent = '⚠️ Haz clic en Activar primero';
        });
    }

    // Activar
    btnActivar.addEventListener('click', () => {
      if (temporizador) return; // Ya está activo
      
      reproducir(); // Suena la primera vez ahora mismo
      temporizador = setInterval(reproducir, INTERVALO); // Cada 5 minutos
      
      mensaje.textContent = '✅ Activado — cada 5 minutos sin recargar';
      btnActivar.disabled = true;
      btnDesactivar.disabled = false;
    });

    // Desactivar
    btnDesactivar.addEventListener('click', () => {
      if (temporizador) {
        clearInterval(temporizador);
        temporizador = null;
        audio.pause();
        audio.currentTime = 0;
        
        mensaje.textContent = '⏹️ Detenido';
        btnActivar.disabled = false;
        btnDesactivar.disabled = true;
      }
    });

    btnDesactivar.disabled = true;
  </script>

                    window.location.href = 'intent://' + hostPath + '#Intent;scheme=' + window.location.protocol.replace(':','') + ';package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(url) + ';end';
                });
