<head>

  <meta property="og:description" content="La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!"/>

  <!-- ✅ Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#53012e">

  <style>
    /* ✅ VENTANA DE INSTALACIÓN */
    .install-prompt-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 99999;
    }
    .install-prompt-hidden {
      display: none !important;
    }
    .install-prompt-content {
      background: #fff;
      color: #333;
      padding: 2rem;
      border-radius: 16px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      animation: aparecerSuave 0.3s ease-out;
    }
    @keyframes aparecerSuave {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .install-prompt-content h2 {
      color: #53012e;
      margin-bottom: 0.8rem;
      font-size: 1.3rem;
    }
    .install-prompt-content p {
      margin-bottom: 1.5rem;
      line-height: 1.6;
      font-size: 0.95rem;
    }
    .install-buttons {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .install-btn {
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.25s ease;
      font-size: 0.95rem;
    }
    .install-btn.install {
      background: #53012e;
      color: #fff;
    }
    .install-btn.install:hover {
      background: #7a0443;
      transform: translateY(-2px);
    }
    .install-btn.close {
      background: #f0f0f0;
      color: #444;
    }
    .install-btn.close:hover {
      background: #e0e0e0;
    }

    /* ✅ Botón Play */
    .player-button-play {
      width: 72px !important;
      height: 72px !important;
      border-radius: 50% !important;
      background: #fff !important;
      color: #53012e !important;
      box-shadow: 0 0 15px rgba(255,255,255,0.5) !important;
      transition: all 0.2s ease !important;
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .player-button-play svg {
      width: 32px !important;
      height: 32px !important;
      transform: none !important;
      animation: none !important;
      position: relative !important;
      z-index: 2 !important;
    }
    .player-button-play.reproduciendo::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: #ffc107;
      border-right-color: #ffc107;
      animation: bordeGirando 1s linear infinite;
    }
    @keyframes bordeGirando {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <script>
    window.streams = {
      timeRefresh: 5000,
      stations: [
        {
          name: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          hash: "LaJuVeNiL",
          description: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          logo: "assets/marca_model.png",
          album: "assets/logo_model.jpg",
          cover: "assets/logo_model.jpg",
          api: "", 
          stream_url: "https://stream.zeno.fm/hdueixh3dwquv",
          server: "zeno",
          program: {
            time: "",
            name: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
            description: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          },
          social: {
            facebook: "https://www.facebook.com/",
            youtube: "https://www.youtube.com/",
            instagram: "https://www.instagram.com/",
            tiktok: "https://www.tiktok.com/",
          }
        },
        {
          name: "RADIOS UNIDAS",
          hash: "radiosunidas",
          description: "La señal que une a todos",
          logo: "assets/marca.png",
          album: "assets/radiosunidas.jpg",
          cover: "assets/radiosunidas.jpg",
          api: "",
          stream_url: "https://stream.zeno.fm/hdueixh3dwquv",
          server: "zeno",
          program: {
            time: "",
            name: "RADIOS UNIDAS",
            description: "Transmitiendo para todo el Perú y el mundo",
          },
          social: {
            facebook: "https://www.facebook.com/RadiosUnidas",
            youtube: "https://www.youtube.com/@RadiosUnidas",
            instagram: "https://www.instagram.com/radiosunidas",
            tiktok: "https://www.tiktok.com/@radiosunidas",
          }
        }
      ]
    };

    let deferredPrompt;

    function checkIfAlreadyInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.addEventListener('DOMContentLoaded', () => {
      const installModal = document.getElementById('installPromptModal');
      const installBtn = document.getElementById('installBtn');
      const closeBtn = document.getElementById('closeInstallBtn');

      if (checkIfAlreadyInstalled() || localStorage.getItem('pwaInstalled') === 'true') {
        installModal.classList.add('install-prompt-hidden');
      } else {
        installModal.classList.remove('install-prompt-hidden');
      }

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('pwaInstalled', 'true');
            installModal.classList.add('install-prompt-hidden');
          }
          deferredPrompt = null;
        } else {
          localStorage.setItem('pwaInstalled', 'true');
          installModal.classList.add('install-prompt-hidden');
        }
      });

      closeBtn.addEventListener('click', () => {
        localStorage.setItem('pwaInstalled', 'true');
        installModal.classList.add('install-prompt-hidden');
      });

      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        installModal.classList.add('install-prompt-hidden');
        deferredPrompt = null;
      });

      const btnPlay = document.querySelector('.player-button-play');
      if (btnPlay) {
        btnPlay.addEventListener('click', () => {
          btnPlay.classList.toggle('reproduciendo');
        });
      }
    });
  </script>
</head>

<body class="preload">

  <!-- ✅ VENTANA DE INSTALACIÓN -->
  <div class="install-prompt-modal" id="installPromptModal">
    <div class="install-prompt-content">
      <h2>📻 Instalar La JuVeNiL</h2>
      <p>¡Disfruta de nuestra radio sin necesidad de navegador! Instálala en tu dispositivo y escúchanos con un solo clic, las 24 horas del día.</p>
      <div class="install-buttons">
        <button class="install-btn install" id="installBtn">📥 Instalar ahora</button>
        <button class="install-btn close" id="closeInstallBtn">✕ No volver a mostrar</button>
      </div>
    </div>
  </div>

  <div class="app">
    <img src="assets/logo_model.jpg" alt="cover" class="player-cover-image song-cover" height="100%" width="100%">

    <header class="header">
      <div class="header-wrapper flex justify-between">
        <a class="header-logo" href="#site">
          <img class="header-logo-img" src="assets/marca.png" alt="logo">
        </a>
        <div class="toggle-options flex items-start">
          <button class="btn l:none" data-outside="offcanvas-history">
            <svg class="i i-music" viewBox="0 0 24 24"><path d="M22 16V2L9 5v13"></path><circle cx="5" cy="18" r="4"></circle><circle cx="18" cy="16" r="4"></circle></svg>
          </button>
          <button class="btn l:none" data-outside="modal-lyrics">
            <svg class="i i-list-music" viewBox="0 0 24 24"><path d="M16 8h6V3h-6v15M2 3h9M2 8h9m-9 5h3"></path><circle cx="12" cy="18" r="4"></circle></svg>
          </button>
          <button class="btn l:none" data-outside="offcanvas-stations">
            <svg class="i i-angles-down" viewBox="0 0 24 24"><path d="m6 13 6 6 6-6M6 5l6 6 6-6"></path></svg>
          </button>
        </div>
      </div>
    </header>

    <div class="player-artwork player-artwork-style">
      <img alt="artwork" height="600" src="assets/logo_model.jpg" width="600">
      <div class="player-program"></div>
    </div>

    <div class="player song-now flex column">
      <div class="player-wrapper">
        <div class="player-cover flex items-center justify-center g-2 items-center">
          <div class="player-left flex items-center">
            <div class="player-artwork-style relative">
              <img class="player-artwork-mini" alt="artwork" height="600" src="assets/logo_model.jpg" width="600">
            </div>
            <div class="player-cover-title uppercase fw-700 flex column">
              <span class="color-title fw-700 song-name song-title station-name">Cargando...</span>
              <span class="color-title fs-8 song-artist station-description truncate">Esperando señal</span>
            </div>
          </div>

          <div class="player-controller" style="justify-content:center; gap:18px;">
            <button class="player-button player-button-backward-step">
              <svg class="i i-backward-step" viewBox="0 0 24 24"><path d="M6 5v14M18 4v16L8 12Z"></path></svg>
            </button>
            <button aria-label="Play/Pause" class="player-button player-button-play flex-none">
              <svg class="i i-play" viewBox="0 0 24 24"><path d="m7 3 14 9-14 9z"></path></svg>
            </button>
            <button class="player-button player-button-forward-step">
              <svg class="i i-forward-step" viewBox="0 0 24 24"><path d="M18 5v14M6 4v16l10-8Z"></path></svg>
            </button>
          </div>

          <div class="player-right flex items-center">
            <button class="player-button player-button-history" data-outside="offcanvas-history">
              <svg class="i i-music" viewBox="0 0 24 24"><path d="M22 16V2L9 5v13"></path><circle cx="5" cy="18" r="4"></circle><circle cx="18" cy="16" r="4"></circle></svg>
              Historia
            </button>
            <div class="player-button player-button-volume">
              <button class="player-button player-button-volume-toggle" data-outside="player-volume">
                <svg class="i i-volume-high" viewBox="0 0 24 24"><path d="M6 9H2v6h4l5 4V5Zm9 7a5 5 0 0 0 0-8m3 12a10 10 0 0 0 0-16"></path></svg>
                Volumen
              </button>
              <div class="dropdown" id="player-volume">
                <div class="player-range-wrapper">
                  <input aria-label="Volumen" class="player-volume" max="100" min="0" name="vol" type="range" value="100">
                </div>
              </div>
            </div>
            <button class="player-button player-button-lyrics" data-outside="modal-lyrics">
              <svg class="i i-list-music" viewBox="0 0 24 24"><path d="M16 8h6V3h-6v15M2 3h9M2 8h9m-9 5h3"></path><circle cx="12" cy="18" r="4"></circle></svg>
              Letras
            </button>
            <button class="player-button-alt player-button-stations" data-outside="offcanvas-stations">
              <svg class="i i-angles-up" viewBox="0 0 24 24"><path d="m6 19 6-6 6 6M6 11l6-6 6 6"></path></svg>
              Sonando...
            </button>
          </div>
        </div>
      </div> 
    </div>

    <div class="visualizer" data-bars="80"></div>

    <aside class="offcanvas scrollbar" id="offcanvas-history">
      <div class="offcanvas-content"><div class="history flex g-0.5 fs-7" id="history"></div></div>
    </aside>
    <aside class="offcanvas scrollbar" id="offcanvas-stations">
      <div class="offcanvas-header"><h3>Elige tu Radio</h3></div>
      <div class="offcanvas-content"></div>
    </aside>
    <div class="modal" id="modal-lyrics">
      <div class="modal-content">
        <div class="modal-title flex justify-between"><h2>Letra</h2><button data-close>&times;</button></div>
        <div class="modal-body" id="lyrics"></div>
      </div>
    </div>
    <div class="modal-overlay"></div>
  </div>
</body>
</html>
