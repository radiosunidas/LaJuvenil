  <script>
    window.streams = {
      timeRefresh: 5000,
      stations: [
        {
          name: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          hash: "LaJuVeNiL",
          description: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          logo: "assets/marca_model.png",
          album: "assets/logo_model.jpg",
          cover: "assets/logo_model.jpg",
          api: "", // Si usas Zeno.fm, déjalo vacío o remueve la consulta externa para que no de error 404
          stream_url: "https://stream.zeno.fm/hdueixh3dwquv",
          server: "zeno", // Indicamos que el servidor es Zeno para que el script lo procese bien
          program: {
            time: "",
            name: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
            description: "La JuVeNiL 𝗧𝗲 𝗘𝗻𝗰𝗶𝗲𝗻𝗱𝗲 𝗕𝗶𝗲𝗻.!",
          },
          social: {
            facebook: "https://www.facebook.com/",
            youtube: "https://www.youtube.com/",
            instagram: "https://www.instagram.com/",
            tiktok: "https://www.tiktok.com/",
          }
        },
        {
          name: "RADIOS UNIDAS",
          hash: "radiosunidas",
          description: "La señal que une a todos",
          logo: "assets/marca.png",
          album: "assets/radiosunidas.jpg",
          cover: "assets/radiosunidas.jpg",
          api: "",
          stream_url: "https://stream.zeno.fm/hdueixh3dwquv",
          server: "zeno",
          program: {
            time: "",
            name: "RADIOS UNIDAS",
            description: "Transmitiendo para todo el Perú y el mundo",
          },
          social: {

            instagram: "https://www.instagram.com/radiosunidas",
            tiktok: "https://www.tiktok.com/@radiosunidas",
          }
        }
      ]
    };

    let deferredPrompt;

    function checkIfAlreadyInstalled() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
    });

    document.addEventListener('DOMContentLoaded', () => {
      const installModal = document.getElementById('installPromptModal');
      const installBtn = document.getElementById('installBtn');
      const closeBtn = document.getElementById('closeInstallBtn');

      if (checkIfAlreadyInstalled() || localStorage.getItem('pwaInstalled') === 'true') {
        installModal.classList.add('install-prompt-hidden');
      } else {
        installModal.classList.remove('install-prompt-hidden');
      }

      installBtn.addEventListener('click', async () => {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          const { outcome } = await deferredPrompt.userChoice;
          if (outcome === 'accepted') {
            localStorage.setItem('pwaInstalled', 'true');
            installModal.classList.add('install-prompt-hidden');
          }
          deferredPrompt = null;
        } else {
          localStorage.setItem('pwaInstalled', 'true');
          installModal.classList.add('install-prompt-hidden');
        }
      });

      closeBtn.addEventListener('click', () => {
        localStorage.setItem('pwaInstalled', 'true');
        installModal.classList.add('install-prompt-hidden');
      });

      window.addEventListener('appinstalled', () => {
        localStorage.setItem('pwaInstalled', 'true');
        installModal.classList.add('install-prompt-hidden');
        deferredPrompt = null;
      });

      const btnPlay = document.querySelector('.player-button-play');
      if (btnPlay) {
        btnPlay.addEventListener('click', () => {
          btnPlay.classList.toggle('reproduciendo');
        });
      }
    });
  </script>
